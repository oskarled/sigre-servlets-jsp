# Configuración de la conexión JDBC a la base de datos sigre_db (MySQL 8).
# Cambie usuario y clave según su instalación local.
# También se pueden sobrescribir con variables de entorno: SIGRE_DB_URL, SIGRE_DB_USUARIO, SIGRE_DB_CLAVE, SIGRE_DB_DRIVER
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/sigre_db?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
db.usuario=root
db.clave=
